name: fork-docker-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/etwk/cli-proxy-api

jobs:
  build-and-push:
    if: github.repository == 'etwk/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          upstream_version="$(git describe --tags --abbrev=0 2>/dev/null || printf 'main')"
          {
            printf 'version=%s-etwk-main\n' "$upstream_version"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'build_date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
